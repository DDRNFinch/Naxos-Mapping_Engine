name: EPA KSB mapping v2

on:
  push:
    branches: [epa-ksb-mapping-v2]
    paths:
      - '.github/workflows/epa-ksb-mapping-v2.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: epa-ksb-mapping-v2
          fetch-depth: 0
      - name: Apply mapping update
        run: python .github/epa-ksb-mapping-v2.py
      - name: Validate official mapping data
        run: |
          python - <<'PY'
          import json
          d=json.load(open('assessment-plans.json',encoding='utf-8'))
          assert d['schemaVersion']==2
          expected={'ST0095':59,'ST0264-SITE':57,'ST0264-AJ':57,'ST0171':62}
          for cid,n in expected.items():
              c=d['courses'][cid]
              assert len(c['ksbMethods'])==n,(cid,len(c['ksbMethods']))
              assert c['portfolioKsbs']
              assert set(c['ksbMethods'].values()) <= {'multiple-choice-test','practical-assessment-with-questions','interview-underpinned-by-portfolio'}
              assert all(c['ksbMethods'][k]=='interview-underpinned-by-portfolio' for k in c['portfolioKsbs'])
          assert d['courses']['ST0095']['ksbMethods']['K22']=='practical-assessment-with-questions'
          assert d['courses']['ST0264-AJ']['ksbMethods']['K31']=='multiple-choice-test'
          assert d['courses']['ST0264-AJ']['ksbMethods']['K38']=='multiple-choice-test'
          assert d['courses']['ST0264-SITE']['ksbMethods']['K24']=='interview-underpinned-by-portfolio'
          assert d['courses']['ST0171']['ksbMethods']['K19']=='multiple-choice-test'
          PY
      - name: Commit clean mapping update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/epa-ksb-mapping-v2.py .github/workflows/epa-ksb-mapping-v2.yml
          git add assessment-plans.json
          git commit -m 'Add official EPA KSB assessment mappings'
          git push origin HEAD:epa-ksb-mapping-v2
