          python - <<'PY'
          import json
          from pathlib import Path
          bank=json.loads(Path('question-banks/ST0095-epa-v1.json').read_text())
          source=json.loads(Path('question-banks/ST0095-epa-authored-v1.json').read_text())
          assert bank['questionCount']==50 and len(bank['questions'])==50
          assert source['questionCount']==50 and len(source['questions'])==50
          expected=['B6','B5','B4','B3','B2','B1','S22','S21','S20','S19','S18','S17','S16','S15','S14','S13','S12','S11','S10','S9','S8','S7','S6','S5','S4','S3','S2','S1','K31','K30','K29','K28','K27','K26','K25','K24','K23','K22','K21','K20','K19','K18','K17','K16','K15','K14','K13','K12','K11','K10']
          assert [q['mappings'][0] for q in bank['questions']]==expected
          assert [q['id'] for q in bank['questions']]==[f'ST0095-EPA-{i:03d}' for i in range(1,51)]
          assert len({q['answers'][q['correct']].strip().lower() for q in bank['questions']})==50
          bad=('during follow equity, diversity and inclusion guidance','during consider the environment when using resources and carrying out processes','during maintain and store hand tools')
          all_text=json.dumps(bank).lower()
          assert not any(x in all_text for x in bad)
          print('Validated 50 authored ST0095 EPA questions and preserved mappings.')
          PY
          git diff --check

      - name: Commit approved bank update
        run: |
          allowed='question-banks/ST0095-epa-authored-v1.json question-banks/ST0095-epa-v1.json scripts/build-question-banks.mjs'
          unexpected=$(git status --porcelain | awk '{print $2}' | grep -v -E '^(question-banks/ST0095-epa-authored-v1.json|question-banks/ST0095-epa-v1.json|scripts/build-question-banks.mjs)$' || true)
          if [ -n "$unexpected" ]; then
            echo 'Unexpected generated changes:'
            echo "$unexpected"
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add question-banks/ST0095-epa-authored-v1.json question-banks/ST0095-epa-v1.json scripts/build-question-banks.mjs
          git commit -m 'Rewrite ST0095 EPA practice bank' || exit 0
          git push
